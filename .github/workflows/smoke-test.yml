name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Lets an organization variable choose the LSP ref to test against, see
      # https://github.com/sublimelsp/lsp_smoke_test#testing-against-an-lsp-branch
      LSP_SMOKE_TEST_LSP_REF: ${{ vars.LSP_SMOKE_TEST_LSP_REF }}
    steps:
      - uses: actions/checkout@v7

      - uses: jiro4989/setup-nim-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: sublimelsp/lsp_smoke_test@v1
        with:
          # Provides the Nim syntax that the server is enabled for.
          extra-packages: nim-lang/NimLime
